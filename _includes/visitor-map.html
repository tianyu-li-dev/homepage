<section class="visitor-map-section" aria-labelledby="visitor-map-title">
  <h2 id="visitor-map-title">Visitor Map</h2>

  <div id="visitor-map-summary" style="display: none;"></div>

  <div class="visitor-map-frame">
    <svg
      id="visitor-world-map"
      viewBox="0 0 960 500"
      role="img"
      aria-label="World map showing approximate visitor cities"
    ></svg>

    <div
      id="visitor-map-tooltip"
      class="visitor-map-tooltip"
      hidden
    ></div>
  </div>

  <div id="visitor-recent-list" style="display: none;"></div>
</section>

<script>
  window.VISITOR_MAP_CONFIG = {
    apiBase: {{ site.visitor_api_base | jsonify }},
    displayTimeZone: {{ site.visitor_display_timezone | default: "America/Indiana/Indianapolis" | jsonify }},
    publicDays: {{ site.visitor_public_days | default: 30 | jsonify }}
  };
</script>

<script
  defer
  src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js">
</script>

<script
  defer
  src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js">
</script>

<script
  defer
  src="{{ '/assets/js/visitor-map.js' | relative_url }}">
</script>
